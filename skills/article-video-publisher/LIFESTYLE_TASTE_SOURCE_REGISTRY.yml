version: 1
last_reviewed: 2026-05-10

# Separate source registry for lifestyle / fashion / taste video candidates.
# Do not mix these sources into SOURCE_REGISTRY.yml, which remains the
# technical AI/backend registry. scripts/source_pool_watch.py can scan this
# file with --registry and write to reports/lifestyle-taste-source-watch/.

sources:
  - id: articles-of-interest
    name: Articles of Interest
    category: Taste
    tier: 1
    type: fashion_culture_podcast
    url: https://www.radiotopia.fm/podcasts/articles-of-interest
    fetch_mode: rss
    fetch_url: https://feed.articlesofinterest.club/
    cadence: daily
    max_items: 8
    weight: 1.10
    use_for: [long_video, research]
    tags: [fashion_history, clothing_culture, design, interviews]
    enabled: true
    notes: Clothing, design, and culture explainers; use only when an episode gives practical styling/taste implications, not history alone.
  - id: wardrobe-crisis
    name: Wardrobe Crisis with Clare Press
    category: Taste
    tier: 1
    type: fashion_sustainability_interview
    url: https://thewardrobecrisis.com/podcast
    fetch_mode: rss
    fetch_url: https://feeds.acast.com/public/shows/60ee3a8f1f9831001383bf3e
    cadence: daily
    max_items: 6
    weight: 0.90
    use_for: [long_video, research]
    tags: [sustainability, fashion_industry, interviews, materials, ethics]
    enabled: true
    notes: Use mainly when an episode offers clear styling, wardrobe, care, repair, or durability principles; avoid serious supply-chain/history/ethics topics without a how-to-wear explanation path.
  - id: dressed-fashion-history
    name: Dressed: The History of Fashion
    category: Taste
    tier: 1
    type: fashion_history_podcast
    url: https://www.dressedhistory.com/
    fetch_mode: rss
    fetch_url: https://rss.pdrl.fm/64b449/feeds.megaphone.fm/ARML9655034287
    cadence: daily
    max_items: 6
    weight: 0.90
    use_for: [long_video, research]
    tags: [fashion_history, clothing_culture, interviews]
    enabled: true
    notes: Use when history directly improves styling judgment; avoid history-only topics for automatic taste videos.
  - id: blamo-podcast
    name: Blamo!
    category: Taste
    tier: 2
    type: fashion_culture_interview
    url: https://blamopod.com/
    fetch_mode: rss
    fetch_url: https://feeds.simplecast.com/_J_JkqSe
    cadence: daily
    max_items: 6
    weight: 1.20
    use_for: [long_video, research]
    tags: [fashion_culture, interviews, designers, personal_style]
    exclude_title_patterns: [patreon preview]
    enabled: true
    notes: Interview discovery source; select only episodes with concrete style, design, craft, or decision-framework value.
  - id: permanent-style
    name: Permanent Style
    category: Taste
    tier: 1
    type: clothing_craft_blog
    url: https://www.permanentstyle.com/
    fetch_mode: rss
    fetch_url: https://www.permanentstyle.com/feed
    cadence: daily
    max_items: 6
    weight: 1.50
    use_for: [long_video, short, research]
    tags: [fit, fabric, tailoring, craft, wardrobe]
    enabled: true
    notes: Strong for fit, fabric, construction, tailoring, and wardrobe quality. Frame lessons gender-neutrally when useful beyond menswear.
  - id: put-this-on
    name: Put This On
    category: Taste
    tier: 2
    type: clothing_style_blog
    url: https://putthison.com/
    fetch_mode: rss
    fetch_url: https://putthison.com/feed/
    cadence: daily
    max_items: 6
    weight: 1.40
    use_for: [long_video, short, research]
    tags: [personal_style, wardrobe, fit, care, clothing_culture]
    enabled: true
    notes: Prefer practical wardrobe, care, repair, fit, or history pieces; avoid sale/deal posts.
  - id: stitchdown
    name: Stitchdown
    category: Taste
    tier: 2
    type: footwear_craft_blog
    url: https://www.stitchdown.com/
    fetch_mode: rss
    fetch_url: https://www.stitchdown.com/feed/
    cadence: daily
    max_items: 5
    weight: 1.15
    use_for: [long_video, short, research]
    tags: [footwear, craft, leather, repair, durability]
    enabled: true
    notes: Good for footwear construction, durability, leather care, repairability, and value-for-use decisions.
  - id: heddels
    name: Heddels
    category: Taste
    tier: 2
    type: clothing_materials_blog
    url: https://www.heddels.com/
    fetch_mode: rss
    fetch_url: https://www.heddels.com/feed/
    cadence: daily
    max_items: 5
    weight: 1.10
    use_for: [long_video, short, research]
    tags: [denim, workwear, fabric, materials, durability]
    enabled: true
    notes: Use for materials, denim/workwear construction, care, and durability; avoid pure shopping/deal posts.
  - id: closet-core-patterns
    name: Closet Core Patterns Blog
    category: Taste
    tier: 2
    type: garment_craft_blog
    url: https://blog.closetcorepatterns.com/
    fetch_mode: rss
    fetch_url: https://blog.closetcorepatterns.com/feed/
    cadence: daily
    max_items: 5
    weight: 1.05
    use_for: [long_video, short, research]
    tags: [garment_construction, fabric, fit, sewing, repair]
    enabled: true
    notes: Good for understanding garment construction, fit adjustments, fabric behavior, and maintenance.
  - id: un-fancy
    name: Un-Fancy
    category: Taste
    tier: 2
    type: capsule_wardrobe_blog
    url: https://www.un-fancy.com/
    fetch_mode: rss
    fetch_url: https://www.un-fancy.com/feed/
    cadence: weekly
    max_items: 5
    weight: 1.05
    use_for: [long_video, short, research]
    tags: [capsule_wardrobe, personal_style, outfit_systems, wardrobe]
    enabled: true
    notes: Use for wardrobe systems, repeatable outfit logic, and low-noise personal style habits.
  - id: aesthetic-of-joy
    name: The Aesthetics of Joy
    category: Taste
    tier: 2
    type: lifestyle_design_blog
    url: https://aestheticsofjoy.com/
    fetch_mode: rss
    fetch_url: https://aestheticsofjoy.com/feed/
    cadence: weekly
    max_items: 5
    weight: 1.05
    use_for: [long_video, short, research]
    tags: [home, design, everyday_objects, color, lifestyle]
    enabled: true
    notes: Broader lifestyle taste source for home, objects, color, and everyday environment; require concrete decision value.
  - id: apartment-therapy
    name: Apartment Therapy
    category: Taste
    tier: 3
    type: home_lifestyle_blog
    url: https://www.apartmenttherapy.com/
    fetch_mode: rss
    fetch_url: https://www.apartmenttherapy.com/main.rss
    cadence: daily
    max_items: 5
    weight: 0.85
    use_for: [short, research]
    tags: [home, small_space, daily_life, organization, design]
    enabled: true
    notes: Discovery-only unless the item teaches a concrete home/life design decision, not product shopping.
  - id: cup-of-jo
    name: Cup of Jo
    category: Taste
    tier: 3
    type: lifestyle_blog
    url: https://cupofjo.com/
    fetch_mode: rss
    fetch_url: https://www.cupofjo.com/feed/
    cadence: daily
    max_items: 5
    weight: 0.80
    use_for: [short, research]
    tags: [lifestyle, relationships, home, everyday_life]
    enabled: true
    notes: Use sparingly for everyday life or relationship taste only when there is a clear, non-gendered practical takeaway.
  - id: business-of-fashion
    name: The Business of Fashion
    category: Taste
    tier: 2
    type: fashion_industry_news
    url: https://www.businessoffashion.com/
    fetch_mode: rss
    fetch_url: https://www.businessoffashion.com/arc/outboundfeeds/rss/?outputType=xml
    cadence: daily
    max_items: 6
    weight: 0.95
    use_for: [research, short]
    tags: [fashion_industry, retail, design_business, trends]
    enabled: false
    notes: Disabled initially because RSS fetch can timeout; context source only when manually reviewed.
