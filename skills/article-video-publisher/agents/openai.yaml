interface:
  display_name: "Article Video Publisher"
  short_description: "Publish deep, understandable source-attributed explainer videos"
  default_prompt: "Use $article-video-publisher to turn this high-signal source into a public Traditional Chinese narrated YouTube explainer that improves both viewer comprehension and knowledge depth. Weight AI-related candidates first when topic selection is open, including AI papers only when they clearly affect AI users/developers/adopters and have method/eval/artifacts, plus high-signal AI leader/researcher/builder interviews with transcript or concrete claims; use non-AI only when AI candidates are thin, duplicate, unverifiable, below quality threshold, or the user supplied a manual URL/topic. Also write an internal review/ai-usage-improvement.md with any concrete improvement this source suggests for Isaac/OpenClaw AI workflows, or a no-op reason. Use OpenAI TTS for narration, but do not run OpenAI billing/cost/usage snapshot scripts or include billing unavailable/cost/usage text unless Isaac explicitly asks for a one-off billing check."

policy:
  allow_implicit_invocation: true
